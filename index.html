<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrthoNow | Expert Orthopaedic Consultation in Bengaluru</title>
    <meta name="description" content="Get an expert orthopaedic opinion for knee or back pain. Book your consultation at OrthoNow Bengaluru.">
    <style>
        :root {
            --primary: #0056b3;
            --text: #333333;
            --bg: #f4f7f6;
            --white: #ffffff;
            --success: #28a745;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: var(--white);
            max-width: 500px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        h1 {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 10px;
            text-align: center;
        }
        p.subhead {
            font-size: 1rem;
            text-align: center;
            margin-bottom: 25px;
            color: #555;
        }
        .trust-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            padding: 10px;
            background: #eef5ff;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--primary);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0,86,179,0.1);
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        button:hover {
            background-color: #004494;
        }
        #thankYouState {
            display: none;
            text-align: center;
            padding: 20px 0;
        }
        .success-icon {
            font-size: 3rem;
            color: var(--success);
            margin-bottom: 15px;
        }
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <h1>Get an expert orthopaedic opinion</h1>
        <p class="subhead">Book your consultation at OrthoNow. Specialised care for knee and back pain.</p>
        
        <div class="trust-badge">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            Trusted by 10,000+ patients across Bengaluru
        </div>

        <form id="consultationForm">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" required placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required pattern="[0-9]{10}" placeholder="10-digit mobile number">
            </div>
            <button type="submit">Book Consultation</button>
        </form>

        <div id="thankYouState">
            <div class="success-icon">✓</div>
            <h2>Booking Request Received</h2>
            <p>Thank you! Our Bengaluru clinic will contact you shortly to confirm your appointment time.</p>
        </div>
    </div>

    <script>
        window.dataLayer = window.dataLayer || [];

        document.getElementById('consultationForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('fullName').value;
            const phone = document.getElementById('phone').value;

            window.dataLayer.push({
                event: 'consultation_form_submitted',
                form_type: 'lead_generation',
                clinic_preference: 'Bengaluru'
            });

            console.log("DataLayer Push Fired:", window.dataLayer[window.dataLayer.length - 1]);

            this.style.display = 'none';
            document.querySelector('.subhead').style.display = 'none';
            document.querySelector('.trust-badge').style.display = 'none';
            document.querySelector('h1').style.display = 'none';
            document.getElementById('thankYouState').style.display = 'block';
        });
    </script>
</body>
</html>
